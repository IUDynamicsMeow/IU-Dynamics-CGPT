<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>IU Dynamics — Software Access</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2e;--line:#29334c;--text:#f3f6ff;--muted:#aab5ce;--accent:#a5b4fc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b2850 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:auto;padding:52px 20px 70px}header{text-align:center;margin-bottom:34px}h1{font-size:clamp(2rem,5vw,3.2rem);margin:0 0 8px;letter-spacing:-.04em}header p,.muted{color:var(--muted)}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px}.plan{background:rgba(20,27,46,.94);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;min-height:230px}.plan h2{margin:0 0 5px}.count{color:var(--accent);font-weight:700;margin:8px 0 18px}.plan button,button{border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:#0b1020;font-weight:750;cursor:pointer;margin-top:auto}.plan button:disabled,button:disabled{opacity:.55;cursor:wait}.status{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);white-space:pre-wrap;display:none}.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.9rem}a{color:#c5ceff}
</style>
</head>
<body><main>
<header><h1>IU Dynamics</h1><p>Choose an access plan and complete its required verified link steps.</p></header>
<section id="plans" class="plans" aria-live="polite"><div class="muted">Loading plans…</div></section>
<div id="status" class="status" role="status" aria-live="polite"></div>
<p class="foot">A return redirect alone does not count as completion. Software keys are not exposed to the browser.</p>
</main>
<script>
const plansEl=document.querySelector('#plans'),statusEl=document.querySelector('#status');
function status(message){statusEl.style.display='block';statusEl.textContent=message}
async function json(url,options){const r=await fetch(url,{headers:{'content-type':'application/json'},...options});const data=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
async function start(slug,button){button.disabled=true;status('Creating your secure access session…');try{const session=await json('/api/session',{method:'POST',body:JSON.stringify({plan:slug})});const result=await json('/api/workink/start',{method:'POST',body:JSON.stringify({sessionToken:session.sessionToken})});if(!result.url)throw new Error('The access link could not be created.');location.href=result.url}catch(e){status(e.message+' Please try again later.');button.disabled=false}}
async function load(){try{const {plans}=await json('/api/plans');if(!plans?.length){plansEl.textContent='No access plans are available right now.';return}plansEl.replaceChildren(...plans.map(p=>{const card=document.createElement('article');card.className='plan';const h=document.createElement('h2');h.textContent=p.display_name;const desc=document.createElement('p');desc.className='muted';desc.textContent='Complete the required verified link steps to qualify.';const count=document.createElement('p');count.className='count';count.textContent=p.required_links+' verified link'+(p.required_links===1?'':'s');const btn=document.createElement('button');btn.textContent='Start '+p.display_name;btn.addEventListener('click',()=>start(p.slug,btn));card.append(h,desc,count,btn);return card}))}catch(e){plansEl.textContent='Plans could not be loaded. Please try again later.';status(e.message)}}
const params=new URLSearchParams(location.search);
if(params.has('unlock')){const messages={ready:'The required link count has been reached. Secure key claiming still needs to be configured.',progress:'Link verification succeeded. Continue with the remaining required links.', 'not-verified':'We could not verify that link completion. No key has been released.','session-expired':'This session expired. Please start again.','verification-error':'Verification is temporarily unavailable. No key has been released.'};status(messages[params.get('unlock')]||'The link result could not be verified. No key has been released.')}
load();
</script>
</body></html>
